plugins {
    id 'java'
}

group = 'domain'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":commons")
    implementation 'software.amazon.awssdk:dynamodb:2.31.28'
    implementation 'software.amazon.awssdk:dynamodb-enhanced:2.31.28'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.19.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.19.0'
    implementation 'com.github.bibsysdev:json:2.2.5'

    testImplementation project(":test-utils")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'com.amazonaws:DynamoDBLocal:2.6.0'
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}